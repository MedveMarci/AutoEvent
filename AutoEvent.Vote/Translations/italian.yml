menu_title: 'Vota un minigioco!'
broadcast_text: |-
  <b>Vota il prossimo minigioco con la tua radio!</b>
  <size=25>Cambia scelta con il clic sinistro. Mancano {duration} secondi.</size>
ended_with_no_vote: '<b>La votazione è terminata senza voti.</b>'
